# app — the native GPUI desktop shell.
#
# The app is a BLIND HOST: it connects to a node, reads the roster, fetches
# each program's view and renders it. It knows no program by name; every
# view request names its own target and the app relays the bytes. Source
# here is the app crate and its boot-time launcher (to return);
# everything else arrives as a cargo git dependency.
#
# The self-update lane (app-update, bin/app-launcher, backend/update*) is
# OUT until the kernel branch stops naming `keyscheme` at sdk `dev`, where it
# no longer exists; cargo refuses a same-source patch. First thing back.

[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false
description = "A local-first consensus workspace for people and agents"
authors = ["Ducktape contributors"]


[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]

# --- sdk-line: modules same-frame-emit @ ade76a8f (Cause::Message; emit runs in the frame), crates/sdk (abi, view-wire, ducklink, design, describe) ---
abi = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "abi" }
view-wire = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "view-wire" }
ducklink = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "ducklink" }
design = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "design" }
# `module.describe`: the runner a program's untrusted describe module goes through
describe = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "describe", features = ["host"] }

# --- node-side: ducktape-industries/ducktape on the kernel branch ---
ducktape-home = { git = "https://github.com/ducktape-industries/ducktape", branch = "feat/capable-sandbox", package = "ducktape-home" }
keystore = { git = "https://github.com/ducktape-industries/ducktape", branch = "feat/capable-sandbox", package = "keystore" }

# --- external ---
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
tracing = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rand = "0.8"
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
tempfile = "3"
zeroize = "1"
# wasmtime — pinned exactly, matching the node's runtime: a module-owned view
# executes in the same wasm semantics the kernel does.
wasmtime = "=46.0.3"
libc = "0.2"

[dependencies]
gpui-kit = "=0.6.1"
gpui-base = "=0.6.4"
unicode-segmentation = "1"
qrcode = { version = "0.14", default-features = false }
futures.workspace = true
design.workspace = true
describe.workspace = true
sha2.workspace = true
ducktape-home.workspace = true
ducktape-rpc = { git = "https://github.com/ducktape-industries/ducktape", rev = "ffa7db0cb359265be0dfe390d950c7f929d383e4" }
keystore.workspace = true
# This device's key, kept by the OS (`backend/device_key.rs`): Keychain,
# Credential Manager, Secret Service (over zbus, no libdbus to link).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
# The passkey lane (`backend/passkey.rs`): the verifier the node runs (to
# pick which passkey signed and to frame its assertion), and the identity
# program's own types, so a Create/AddKey/Consent is the program's bytes.
keyscheme = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "736865710dcfa7c56f9834747287881c1c25d45d", package = "keyscheme" }
identity = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "identity" }
# The roster's full query surface: its programs and its view-only entries.
module-registry = { git = "https://github.com/ducktape-industries/modules", rev = "ade76a8fb74fedd0c8b30a7a62c620aeb3d14ba6", package = "module-registry" }
base64 = "0.22"
commonware-cryptography.workspace = true
commonware-codec.workspace = true
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true
view-wire = { workspace = true, features = ["manifest"] }
abi.workspace = true
borsh.workspace = true
ducklink.workspace = true
tokio-tungstenite = "0.24"
wasmtime.workspace = true
wasmparser = "0.251"
libc.workspace = true
sha1 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
# The screen-share leg (`src/video.rs`): the main display through
# `CGDisplayCreateImage`. Already in this binary's graph under gpui.
core-graphics = "0.24"
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSError", "NSDictionary", "NSObject"] }
objc2-user-notifications = { version = "0.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse"] }

# Everywhere else the notifier is the freedesktop notifications service, one
# `Notify` call on the session bus. zbus is already in this binary's graph
# under the accessibility stack; this only names it.
[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus = "5"
# The screen-share leg (`src/video.rs`): a root-window grab over X11. Already
# in this binary under winit, and pure Rust — the portal/pipewire route would
# put a build-time system library on every machine that builds this app. A
# Wayland session's X root holds X clients only, so the share refuses there
# rather than grab a black desktop (`ScreenSource::open`).
# `composite` for the window shares: an unredirected window cannot be named as
# a pixmap, and reading the window drawable itself returns undefined bytes
# wherever something overlaps it. `randr` (the heads) and `xfixes` (the pointer)
# are already on through gpui; naming them here keeps the picker from silently
# losing them if gpui ever stops asking.

[dev-dependencies]
# hand-written wasm for the describe method's hostile-section tests
wat = "1"
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
# walks the AccessKit tree the ax_contract gate reads (the adapters' version)
accesskit_consumer = "=0.38.0"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
# the dependency line this app is held to is read off the manifests, not
# asserted about from memory: `the_app_links_only_what_it_still_speaks_for`
commonware-cryptography.workspace = true
commonware-codec.workspace = true
tempfile.workspace = true
keyscheme = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "736865710dcfa7c56f9834747287881c1c25d45d", package = "keyscheme", features = ["testkit"] }
p256 = "0.13"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.5" }

[patch.crates-io]
gpui-pre-wgpu = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "7067cdfacd77d19fc6f78d03142987f90dfa59af" }
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
gpui-pre-zlog = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
gpui-pre = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
# Window::set_bounds: the X11 and macOS backends, vendored in the fork
gpui-pre-linux = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
gpui-pre-macos = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }

# dev/test builds compile wasm guests through cranelift (module-owned view
# fixtures); unoptimized cranelift is 10-30x slower, so the code generator
# itself is always built optimized. build-time only.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.ducktape-app]
debug = 0
opt-level = 0

# Keep native UI unit test code compact on the default test worker stack.
[profile.test.package.ducktape-app]
debug = 0
opt-level = 1

# Optimize the native render and text stack without slowing unrelated workspace crates.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.design]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.yazi]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.lyon]
opt-level = 2

[profile.dev.package.lyon_algorithms]
opt-level = 2

[profile.dev.package.lyon_geom]
opt-level = 2

[profile.dev.package.lyon_path]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

# The sign-in unlock, and every signed write after it, runs one argon2id pass
# over a 64 MiB buffer — the KDF is SUPPOSED to be expensive, but only at its
# release speed.
[profile.dev.package.argon2]
opt-level = 3

